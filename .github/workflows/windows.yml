name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust checks
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - name: Select toolchain
        run: rustup override set 1.93.0
      - name: Cache Rust dependencies and release artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-1.93-release-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-rust-1.93-release-v2-
      - name: Consistent private-path remapping
        shell: pwsh
        run: |
          $flags = "--remap-path-prefix=$pwd=/source$([char]31)--remap-path-prefix=$env:USERPROFILE=/toolchain"
          "CARGO_ENCODED_RUSTFLAGS=$flags" >> $env:GITHUB_ENV
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Check source privacy
        run: python scripts/check-source-privacy.py
      - name: Test privacy guard
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test installer and updater boundaries
        shell: powershell
        run: ./scripts/test-installer.ps1
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"').Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo.toml version' }
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify package and executable
        run: python scripts/verify-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/v*/*.zip
            dist/v*/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts
      - name: Publish private-repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find artifacts -type f \( -name '*.zip' -o -name SHA256SUMS.txt \) -print0)
          test "${#files[@]}" -eq 2
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Oh My Backup $GITHUB_REF_NAME" --notes-file CHANGELOG.md "${files[@]}"
