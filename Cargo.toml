[package]
name = "oh-my-backup"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
description = "Windows desktop backup synchronization over SSH"
repository = "https://github.com/ersinkoc/oh-my-backup"
license = "MIT"

[profile.release]
strip = true
debug = 0

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake2b_simd = "1.0.5"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.34"
egui_extras = "0.34"
filetime = "0.2.29"
fs2 = "0.4.3"
regex = "1.13.1"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell"] }
